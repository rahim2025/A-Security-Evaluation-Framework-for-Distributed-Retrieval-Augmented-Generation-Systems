# Distinct project name + container names + host ports so this stack can run
# alongside a teammate's separate checkout of the same project on a shared
# Docker daemon without silently overwriting each other's containers (see
# problems/data_poisoning_gaps.md for the incident this fixes).
name: reliable-drag-poisoning

services:
  # Contract Service (Hardhat Node)
  hardhat-node:
    build:
      context: .
      dockerfile: drag_contract/Dockerfile
    container_name: rdp-hardhat-node
    ports:
      - "18545:8545"
    restart: unless-stopped
    networks:
      - drag_network
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 240s

  # Data Source Services
  data-source-0:
    build:
      context: .
      dockerfile: drag_data_source/Dockerfile
    container_name: rdp-data-source-0
    ports:
      - "18001:8001"
    volumes:
      - ./data/polluted_token:/data
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - CONFIG_PATH=/app/configs/config_sources_0_clean.yaml
    restart: unless-stopped
    networks:
      - drag_network
    depends_on:
      hardhat-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  data-source-20:
    build:
      context: .
      dockerfile: drag_data_source/Dockerfile
    container_name: rdp-data-source-20
    ports:
      - "18002:8001"
    volumes:
      - ./data/polluted_token:/data
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/configs/config_sources_20_clean.yaml
    restart: unless-stopped
    networks:
      - drag_network
    depends_on:
      hardhat-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  data-source-100:
    build:
      context: .
      dockerfile: drag_data_source/Dockerfile
    container_name: rdp-data-source-100
    ports:
      - "18003:8001"
    volumes:
      - ./data/polluted_token:/data
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_PATH=/app/configs/config_sources_100_clean.yaml
    restart: unless-stopped
    networks:
      - drag_network
    depends_on:
      hardhat-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # LLM Orchestrator Service
  llm-service:
    build:
      context: .
      dockerfile: drag_llm_service/Dockerfile
      args:
        INSTALL_VLLM: ${INSTALL_VLLM:-true}
    container_name: rdp-llm-service
    ports:
      - "19000:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_USE_FLASHINFER_SAMPLER=0
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
    depends_on:
      hardhat-node:
        condition: service_healthy
      data-source-0:
        condition: service_healthy
      data-source-20:
        condition: service_healthy
      data-source-100:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - drag_network

networks:
  drag_network:
    driver: bridge
